[package]
name = "py-packbed"
version = "0.0.14"
edition = "2021"
authors = ["alejandrogzi <alejandrxgzi@gmail.com>"]
license = "MIT"
description = "Python bindings for packing BED records into overlapping components"
keywords = ["components", "overlap", "transcript", "bed"]
readme = "README.md"
homepage = "https://github.com/alejandrogzi/packbed"
repository = "https://github.com/alejandrogzi/packbed"
categories = ["science"]

[lib]
name = "packbed"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.22.0"
packbed_core = { package = "packbed", path = "../packbed" }
