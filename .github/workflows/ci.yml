name: CI

on:
  pull_request:
  push:
    tags-ignore:
      - "v*"

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Check packbed
        run: cargo check --manifest-path ./packbed/Cargo.toml

      - name: Lint packbed
        run: |
          cargo clippy --manifest-path ./packbed/Cargo.toml --all-targets \
            --all-features

      - name: Test packbed
        run: cargo test --manifest-path ./packbed/Cargo.toml

      - name: Test packbed (dashmap backend)
        run: cargo test --manifest-path ./packbed/Cargo.toml --features dashmap

      - name: Check formatting
        run: |
          cargo fmt --manifest-path ./packbed/Cargo.toml --check
          cargo fmt --manifest-path ./py-packbed/Cargo.toml --check

      - name: Build packbed release
        run: cargo build --manifest-path ./packbed/Cargo.toml --release

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test py-packbed Rust crate
        run: cargo test --manifest-path ./py-packbed/Cargo.toml

      - name: Lint py-packbed
        run: cargo clippy --manifest-path ./py-packbed/Cargo.toml --all-targets

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build py-packbed wheel
        working-directory: py-packbed
        run: maturin build --release --out dist

      - name: Install py-packbed wheel
        run: python -m pip install --force-reinstall py-packbed/dist/*.whl

      - name: Test py-packbed
        working-directory: py-packbed
        run: python -m pytest
